name: Test d'envoi YouTube

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Créer une vidéo test de 10 secondes
        run: |
          ffmpeg -y -f lavfi -i testsrc2=size=1280x720:rate=30:duration=10 \
                 -f lavfi -i sine=frequency=440:duration=10 \
                 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest test.mp4
      - name: Envoyer en privé sur YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python pipeline/youtube_upload.py test.mp4 \
            --title "Test automatique — à supprimer" \
            --description "Vidéo de test de la publication automatique." \
            --privacy private
