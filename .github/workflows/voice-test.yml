name: Test de voix Gemini (Riko)

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/voice-test.yml"]

concurrency:
  group: voice-test
  cancel-in-progress: true

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Générer la narration complète (1 requête par partie)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/gemini_tts.py videos/kodak/voix_gemini_expressif.txt out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voix-test
          path: out/
          retention-days: 7
